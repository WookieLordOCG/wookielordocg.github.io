<body>
  <header>
    <!-- ... ton header/navigation identiques ... -->
  </header>

  <main>
    <!-- ... toutes tes sections identiques (hero, projets, vidéos, archives, contact, etc.) ... -->

    <footer class="container">
      <small>© <span id="year"></span> Nicolas Krasnoholowy — Portfolio</small>
    </footer>
  </main>

  <!-- Plus de <canvas>, ni #walker -->
  <!-- Plus de secret icon -->

  <script>
    // Juste l’année
    document.getElementById('year').textContent = new Date().getFullYear();

    // Révélation progressive des sections
    const io = new IntersectionObserver((entries)=>{
      for(const e of entries){
        if(e.isIntersecting){
          e.target.classList.add('is-visible');
          io.unobserve(e.target);
        }
      }
    }, { threshold: 0.12 });
    document.querySelectorAll('.reveal').forEach(el=>io.observe(el));

    // ---- Onglets CV + auto-height iframe ----
    (function(){
      const frBtn = document.getElementById('cv_fr_btn');
      const enBtn = document.getElementById('cv_en_btn');
      const frame = document.getElementById('cvFrame');

      function setLang(lang){
        const src = (lang === 'en') ? 'cv_en_black.html' : 'cv_fr_black.html';
        frame.src = src;
        frBtn.classList.toggle('active', lang!=='en');
        enBtn.classList.toggle('active', lang==='en');
        frBtn.setAttribute('aria-selected', lang!=='en');
        enBtn.setAttribute('aria-selected', lang==='en');
      }
      frBtn?.addEventListener('click', ()=>setLang('fr'));
      enBtn?.addEventListener('click', ()=>setLang('en'));

      function fitIframe(){
        try{
          const d = frame.contentWindow.document;
          const h = Math.max(
            d.body.scrollHeight,
            d.documentElement.scrollHeight,
            1000
          );
          frame.style.height = (h + 20) + 'px';
        }catch(e){}
      }
      frame.addEventListener('load', fitIframe);
      window.addEventListener('resize', ()=>setTimeout(fitIframe, 150));
    })();
  </script>
</body>
