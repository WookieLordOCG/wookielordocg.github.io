<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <title>Blog — Nico Krash</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <style>
    :root {
      --bg: #050507;        /* fond plus profond */
      --card: #101018;      /* cartes/panneaux plus sombres */
      --ink: #e9e9ef;       /* texte principal */
      --muted: #9a9cab;     /* texte secondaire */
      --accent: #6ad0ff;    /* bleu clair un peu adouci */
      --line: #1e2330;      /* bordures */
    }

    html,body{background:var(--bg); color:var(--ink); font-family:system-ui,Segoe UI,Inter,Arial,sans-serif; margin:0;}
    header{max-width:980px; margin:32px auto 0; padding:0 16px 8px; border-bottom:1px solid var(--line);}
    header h1{font-size:28px; margin:0 0 6px;}
    header p{margin:0 0 14px; color:var(--muted)}
    main{max-width:980px; margin:0 auto; padding:16px;}
    .post{background:var(--card); border:1px solid var(--line); border-radius:16px; padding:18px; margin:18px 0; box-shadow:0 6px 22px rgba(0,0,0,.25);}
    .post h2{margin:0 0 6px; font-size:22px; line-height:1.25}
    .meta{color:var(--muted); font-size:14px; margin-bottom:12px}
    .media{margin:10px 0}
    .media img, .media video{max-width:100%; display:block; border-radius:12px; margin:10px 0; outline:1px solid var(--line)}
    audio{width:100%; margin:10px 0}
    .content p{line-height:1.7; margin:10px 0}
    .likebar{display:flex; align-items:center; gap:10px; margin-top:12px}
    .likebtn{
      background:#1f2330;
      border:1px solid var(--line);
      color:var(--ink);
      padding:8px 14px;
      border-radius:999px;
      cursor:pointer;
      font-weight:600;
      transition: transform 0.15s ease-in-out;
    }
    .likebtn.liked{
      animation: pop 0.4s ease;
      background:#ff2d55;
      color:#fff;
    }
    @keyframes pop {
      0%   { transform: scale(1); }
      50%  { transform: scale(1.4); }
      100% { transform: scale(1); }
    }
    .count{color:var(--muted)}
    .grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(220px,1fr)); gap:10px}
    .sep{height:1px; background:var(--line); margin:24px 0}
    a{color:var(--accent); text-decoration:none} a:hover{text-decoration:underline}
    footer{max-width:980px; margin:24px auto 40px; padding:0 16px; color:var(--muted)}
    .tags{margin-left:6px; font-size:12px; opacity:.9}
    .badge{display:inline-block; background:#1b1d26; border:1px solid var(--line); padding:3px 8px; border-radius:999px; margin-right:6px}
    .empty{color:var(--muted); text-align:center; padding:40px 0}
  </style>
</head>
<body>
  <header>
    <h1>Blog — Nico Krash</h1>
    <p>Notes de dev, images, musiques, vidéos — et un ❤️ pour soutenir les posts.</p>
  </header>

  <main id="app">
    <div id="posts"></div>
    <div class="sep"></div>
    <footer>
      <span class="badge">Statique</span>
      <span class="badge">Firebase Likes</span>
      <span class="badge">HTML fait main</span>
    </footer>
  </main>

  <script type="module">
    // =========================
    // === CONTENU : TES POSTS ICI ===
    const POSTS = [
      {
        id: "premier-post",
        title: "Prototype Cassette — crash-site",
        date: "2025-09-19",
        html: `
          <p>Petit carnet de bord ✍️ Premier assemblage du crash-site, Pandamour observe les colonnes basaltiques.
          J'ai branché l'AGLS sur UE 5.6 et testé un brouillard volumétrique doux. Sentiment de monde fossile 💿🪨.</p>
        `,
        images: ["https://picsum.photos/seed/cassette/1200/700"],
        videos: [],
        audio: [],
        tags: ["Cassette","UE5","Prototype"]
      },
      {
        id: "croquis-pandamour",
        title: "Croquis Pandamour + motif robe",
        html: `
          <p>Étude lumière douce, robe à carreaux bleus, Grochat passe la tête (évidemment).
          Style réaliste-stylisé, textures fourrure/tissu soignées.</p>
        `,
        images: [
          "https://picsum.photos/seed/pandamour/1200/800",
          "https://picsum.photos/seed/grochat/1200/800"
        ],
        videos: [],
        audio: [],
        tags: ["Pandamour","Croquis","Stylebook"]
      }
    ];
    // =========================

    // Helpers
    const $ = sel => document.querySelector(sel);
    const el = (tag, cls) => { const n=document.createElement(tag); if(cls) n.className=cls; return n; }
    const fmtDate = (d) => new Date(d).toLocaleDateString("fr-FR", { year:"numeric", month:"long", day:"numeric" });

    // Firebase
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.0.0/firebase-app.js";
    import { getDatabase, ref, get, set } from "https://www.gstatic.com/firebasejs/9.0.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAqvDveF6fCyBzGu0LbRO7qL6jkl9GDydU",
      authDomain: "blog-nico--krash.firebaseapp.com",
      databaseURL: "https://blog-nico--krash-default-rtdb.europe-west1.firebasedatabase.app",
      projectId: "blog-nico--krash",
      storageBucket: "blog-nico--krash.firebasestorage.app",
      messagingSenderId: "404335649602",
      appId: "1:404335649602:web:4e89e1758c0741f9bddedb",
      measurementId: "G-YFE1LQHJV9"
    };

    const appFB = initializeApp(firebaseConfig);
    const db = getDatabase(appFB);

    // Rendu
    const mount = async () => {
      const wrap = $("#posts");
      if(!POSTS.length){
        const empty = el("div","empty"); empty.textContent = "Aucun article pour l’instant.";
        wrap.appendChild(empty); return;
      }

      for(const post of POSTS){
        const dateISO = post.date || new Date().toISOString().slice(0,10);

        const card = el("article","post");
        const h2 = el("h2"); h2.textContent = post.title;
        const meta = el("div","meta");
        const tgs = (post.tags && post.tags.length) ? ` · <span class="tags">${post.tags.map(t=>`#${t}`).join(" ")}</span>` : "";
        meta.innerHTML = `<span>${fmtDate(dateISO)}</span>${tgs}`;

        const body = el("div","content"); body.innerHTML = post.html || "";

        // Images
        if(post.images?.length){
          const g = el("div","media grid");
          post.images.forEach(src=>{
            const im = el("img"); im.loading="lazy"; im.src = src; im.alt = post.title;
            g.appendChild(im);
          });
          body.appendChild(g);
        }
        // Vidéos
        if(post.videos?.length){
          post.videos.forEach(src=>{
            const v = el("video","media"); v.controls = true; v.src = src;
            body.appendChild(v);
          });
        }
        // Audio
        if(post.audio?.length){
          post.audio.forEach(src=>{
            const a = el("audio"); a.controls = true; a.src = src;
            body.appendChild(a);
          });
        }

        // Like
        const likeBar = el("div","likebar");
        const btn = el("button","likebtn"); btn.textContent = "❤️ J’aime";
        const count = el("span","count"); count.textContent = "…";
        likeBar.append(btn, count);

        // Lecture compteur
        const path = `likes/${post.id}`;
        try{
          const snap = await get(ref(db, path));
          count.textContent = (snap.exists()? snap.val() : 0) + " like(s)";
        }catch(e){ count.textContent = "0 like(s)"; }

        // Incrément avec protection localStorage + animation
        btn.addEventListener("click", async ()=>{
          if(localStorage.getItem("liked_"+post.id)){
            count.textContent = count.textContent.replace("like(s)", "like(s) — déjà liké ✔");
            return;
          }
          try{
            const snap = await get(ref(db, path));
            const cur = snap.exists()? snap.val() : 0;
            await set(ref(db, path), cur + 1);
            count.textContent = (cur+1) + " like(s)";
            localStorage.setItem("liked_"+post.id, "1");
            btn.classList.add("liked");
            setTimeout(()=> btn.classList.remove("liked"), 400);
          }catch(e){
            btn.disabled = true;
            count.textContent = "erreur de like";
          }
        });

        card.append(h2, meta, body, likeBar);
        wrap.appendChild(card);
      }
    };

    mount();
  </script>
</body>
</html>
